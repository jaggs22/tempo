name = "tempo"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tempo"
database_id = "a9ccebca-c80f-478a-bfa0-666bed26dc21"
migrations_dir = "migrations"

[vars]
DEV_MODE = "0"
VAPID_SUBJECT = "https://tempo.jagannadh-rao22.workers.dev"
# GOOGLE_CLIENT_ID is public and lives here; GOOGLE_CLIENT_SECRET is a Worker secret set by the deploy workflow.
# TEACHER_EMAILS = "teacher@gmail.com"   # optional allow-list; empty = any Google account can create a studio
